# For more information on this configuration, see the complete reference guide at
# https://grafana.com/docs/tempo/latest/configuration/
# Based on: https://github.com/grafana/tempo/blob/main/example/docker-compose/single-binary/tempo.yaml
# Migrated for Tempo 3.x monolithic mode (ingester/compactor/local-blocks removed).

# Enables result streaming from Tempo (to Grafana) via HTTP.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

metrics_generator:
  processor:
    span_metrics:
      dimensions:
        - http.method
        - http.target
        - http.status_code
        - service.version
    service_graphs:
      dimensions:
        - http.method
        - http.target
        - http.status_code
        - service.version
  registry:
    collection_interval: 5s
    external_labels:
      source: tempo
      group: spanimals
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

query_frontend:
  mcp_server:
    enabled: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    compaction:
      block_retention: 1h # short-lived demo; default is 14d
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
